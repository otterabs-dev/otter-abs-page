<!DOCTYPE html>
<html lang="de" class="scroll-smooth h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otter Abs</title>
  <meta name="description" content="Otter Abs – Other Apps? No, Otter Abs!">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

  <!-- Minimal Header -->
  <header class="border-b border-slate-900/80 backdrop-blur-sm sticky top-0 z-50 bg-slate-950/70">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 group">
        <img src="assets/logo.png" alt="Otter Abs Logo" class="w-9 h-9 object-contain drop-shadow group-hover:scale-105 transition-transform duration-200">
        <span class="font-extrabold text-lg tracking-tight text-white group-hover:text-orange-400 transition-colors">Otter Abs</span>
      </a>
      <nav class="flex items-center space-x-6 text-xs sm:text-sm font-medium text-slate-400">
        <a href="privacy.html" class="hover:text-white transition-colors">Datenschutz</a>
        <a href="impressum.html" class="hover:text-white transition-colors">Impressum</a>
      </nav>
    </div>
  </header>

  <!-- Hero Content (Small & Simple) -->
  <main class="flex-grow flex items-center justify-center py-12 sm:py-16 px-4 sm:px-6 text-center">
    <div class="max-w-xl mx-auto flex flex-col items-center">
      
      <!-- In Development Badge -->
      <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20 mb-8">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span>In Development</span>
      </div>

      <!-- Mascot Logo (Transparent & Floating) -->
      <div class="relative mb-8 flex justify-center">
        <div class="absolute inset-0 bg-gradient-to-tr from-teal-500/20 via-orange-500/20 to-transparent rounded-full blur-2xl transform scale-110 pointer-events-none"></div>
        <img src="assets/logo.png" alt="Otter Abs Mascot" class="relative w-52 sm:w-64 drop-shadow-2xl hover:scale-105 transition-transform duration-300">
      </div>

      <!-- Slogan -->
      <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-white mb-3">
        Other Apps? <br />
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-300 to-teal-400">No, Otter Abs!</span>
      </h1>
      
      <p class="text-sm sm:text-base text-slate-400 max-w-sm mx-auto leading-relaxed">
        Independent Mobile Apps.<br />
        Aktuell in Entwicklung.
      </p>

    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="border-t border-slate-900 py-8 px-4 sm:px-6 bg-slate-950 text-xs text-slate-500">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-2">
        <img src="assets/logo.png" alt="Otter Abs" class="w-5 h-5 object-contain">
        <span>&copy; 2026 Otter Abs.</span>
      </div>
      <div class="flex space-x-6">
        <a href="privacy.html" class="hover:text-slate-300 transition-colors">Datenschutzerklärung</a>
        <a href="impressum.html" class="hover:text-slate-300 transition-colors">Impressum</a>
        <a href="mailto:otterabs@gmail.com" class="hover:text-slate-300 transition-colors">otterabs@gmail.com</a>
      </div>
    </div>
  </footer>

</body>
</html>
