<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Weiterleitung...</title>
  <script>
    (function () {
      var p = window.location.pathname || "";
      if (/^\/kruzafix(\/.*)?$/i.test(p) && p.indexOf("/Kruzafix") !== 0) {
        var rest = p.replace(/^\/kruzafix/i, "");
        window.location.replace("/Kruzafix" + (rest || "/") + window.location.search + window.location.hash);
      } else {
        window.location.replace("/");
      }
    })();
  </script>
</head>
<body></body>
</html>
